  heading: The Freddy Hutkick
  page_title: "The Freddy Hutkick: sex, fight, food and water"
  og_title: "The Freddy Hutkick: sex, fight, food and water in one evening"
  og_type: article
  description: >-
    The Freddy Hutkick is a four-part evening — water, grappling, a single course
    and sex — conducted in one session, in a fixed order, and never scored.
  published: "2026-08-13"
