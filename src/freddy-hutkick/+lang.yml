  # --- Standfirst ----------------------------------------------------------
  # A self-contained definition, deliberately ahead of the essay's own opening:
  # it is the passage a search or answer engine will lift to answer "what is it".
  summary: >-
    **The Freddy Hutkick** is a four-part evening — water, grappling, a single
    course, and sex — conducted in one session, in a fixed order. It treats
    hunger, aggression and desire as one system rather than three, with water as
    the medium the other three happen in. Nothing in it is scored.

