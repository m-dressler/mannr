<slot name="head">

<slot name="title">{profile} | {bank}</slot>

    style="view-transition-name: current-avatar"
  />

    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 256 256"
    class="absolute top-3/10 w-4/10 left-3/10 pointer-events-none"
  >
    <rect width="256" height="256" fill="none" />
    <path
      d="M92.69,216H48a8,8,0,0,1-8-8V163.31a8,8,0,0,1,2.34-5.65L165.66,34.34a8,8,0,0,1,11.31,0L221.66,79a8,8,0,0,1,0,11.31L98.34,213.66A8,8,0,0,1,92.69,216Z"

    <line
      x1="164"
      y1="92"
      x2="68"

      stroke-width="16"

</a>

<h2 id="display-name" class="mt-3 mb-0 text-2xl font-bold"></h2>
<p id="email-line" class="text-gray-400 mb-3"></p>

<dl class="grid grid-cols-2 gap-x-6 gap-y-1 max-w-md mb-6">
  <dt class="text-gray-400">{balance}</dt>
  <dd id="stat-mps" class="text-right font-semibold"></dd>

  <dt class="text-gray-400" data-show-if-reserved>{reserved}</dt>
  <dd
    id="stat-reserved"
    class="text-right text-yellow-500"
    data-show-if-reserved
  ></dd>

  <dt class="text-gray-400" data-show-if-reserved>{available}</dt>
  <dd
    id="stat-available"
    class="text-right font-semibold"
    data-show-if-reserved
  ></dd>

  <dt class="text-gray-400">{joined}</dt>
  <dd id="stat-joined" class="text-right"></dd>

  <dt class="text-gray-400" data-show-if-referrer>{invited_by}</dt>
  <dd id="stat-referrer" class="text-right" data-show-if-referrer></dd>

  <dt class="text-gray-400" data-show-if-invited>{you_invited}</dt>
  <dd id="stat-invited" class="text-right" data-show-if-invited></dd>
</dl>

<div class="max-w-md w-full">
  <h3 class="font-bold text-lg mb-2">{roles}</h3>
  <ul class="space-y-1">
    {#each roles_details as role}
    <li
      id="role-row-{role.id}"
      class="flex items-start gap-2 p-2 rounded border border-gray-700"
    >
      <span class="text-lg leading-none" data-role-indicator>○</span>
      <div>
        <p class="font-semibold">{role.name}</p>
        <p class="text-sm text-gray-400">{role.description}</p>
      </div>
    </li>
    {/each}
  </ul>
</div>

<a id="invite-link" href="/bank/invite" class="mt-6 inline-block" hidden
>{invite_someone} →</a>
