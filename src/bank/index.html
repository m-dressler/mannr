<slot name="head">
  <script src="/js/dialog.ts" async></script>
  <script src="/js/toast.ts" async></script>
</slot>
<slot name="title">{pageName} | {bank}</slot>
<slot name="header">
  <button
    type="button"
    data-type="streak-flame"
    data-dialog="streak-modal"
    title="{streak_info.title}"
    class="ml-auto h-8 inline-flex items-center gap-1 px-2 py-0 bg-transparent hover:bg-main/10 font-semibold"
    hidden
  >
    🔥 <span data-type="streak-count"></span>
  </button>
  <a href="/bank/me">
    <img
      data-type="profile-picture"
      src="https://www.gravatar.com/avatar/?d=mp"
      class="h-8 rounded-full"
      style="view-transition-name: current-avatar"
    />
  </a>
</slot>

<h1>{leaderboard}</h1>
<ol
  class="grid gap-8 grid-cols-3 max-w-lg"
  data-type="leaderboard"
  data-hide-on-search
>
  <template>
    <li>
      <a href="/bank/users/" class="flex flex-col items-center">
        <img
          src=""
          alt="User Image"
          class="rounded-full mb-4 border-main border-2"
          style="view-transition-name: user-avatar"
        />
        <h4 class="text-lg font-bold"
          style="view-transition-name: user-name"></h4>
        <p class="text-gray-500 text-s" style="view-transition-name: user-info">
          {mps}
        </p>
      </a>
    </li>
  </template>
</ol>

<div>
  <search class="flex items-center gap-1 mt-6 mb-1">
    <input
      type="search"
      id="user-search"
      class="grow h-6 px-1"
      placeholder="{search_users}"
    >
    <img
      src="@lib/client/icons/search.svg"
      inline
      class="w-6 h-6"
      fill="white"
    >
  </search>

  <table data-type="user-list" class="mt-2">
    <template>
      <tr>
        <td class="p-1 pr-2 align-middle">
          <img
            src=""
            alt="User Image"
            class="rounded-full border-main border-2 w-8 h-8"
            style="view-transition-name: user-avatar"
          />
        </td>
        <td class="pr-2 align-middle">
          <a href="/bank/users/" class="flex items-center">
            <h4 class="text-lg font-bold"
              style="view-transition-name: user-name"></h4>
          </a>
        </td>
        <td class="align-middle">
          <p class="text-gray-500 text-s"
            style="view-transition-name: user-info">
          {mps}
        </p>
        </td>
      </tr>
    </template>
  </table>
  <p
    id="user-list-empty"
    class="mt-4 text-gray-500"
    style="display: none"
  >{no_users_found}</p>
  <button
    id="user-list-load-more"
    type="button"
    class="mt-4 bg-gray-700 hover:bg-gray-600"
    style="display: none"
  >{load_more}</button>
</div>

<slot name="modals">
  <dialog class="modal" closedby="any" id="streak-modal">
    <article>
      <header>
        <h4>🔥 {streak_info.title}</h4>
      </header>
      <main>
        <p class="mb-3">{streak_info.explanation}</p>
        <p class="mb-1">{streak_info.rewards}</p>
        <ul id="streak-reward-list" class="mb-3">
          <template>
            <li class="flex justify-between gap-4">
              <span>{streak_info.day}</span>
              <em>{mps}</em>
            </li>
          </template>
        </ul>
        <p id="streak-reward-repeat" class="text-sm text-gray-400">
          {streak_info.repeat, days: [DAYS], mps: [MPS]}
        </p>
      </main>
      <footer>
        <form method="dialog">
          <button class="py-1">{streak_info.close}</button>
        </form>
      </footer>
    </article>
  </dialog>
</slot>

<script src="/bank/index.ts" inline></script>
